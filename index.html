<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111">
<title>Consulta animals</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif;color:#111;min-height:100vh}
.app{max-width:520px;margin:auto;padding:14px}
.result{background:#fff;border-radius:18px;padding:18px 14px;margin-bottom:14px;text-align:center;min-height:155px;box-shadow:0 2px 8px #0002}
.label{font-size:18px;font-weight:700;color:#666;margin-bottom:8px}
.date{font-size:42px;font-weight:800;line-height:1.05;margin:6px 0}
.sub{font-size:18px;color:#444;margin-top:10px}
.dup{font-size:30px;font-weight:800;margin:8px 0 14px}
.row{display:flex;gap:8px;justify-content:center;align-items:stretch;margin:8px 0}
.display{background:#111;color:#fff;border-radius:14px;padding:12px;font-size:38px;font-weight:800;letter-spacing:6px;min-height:64px;flex:1;text-align:center}
.clear{border:0;border-radius:14px;background:#d9d9d9;font-size:18px;font-weight:800;padding:0 16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.key{border:0;border-radius:18px;background:#fff;box-shadow:0 2px 7px #0002;height:82px;font-size:36px;font-weight:800}
.key:active,.clear:active{transform:scale(.97);background:#ddd}
.help{text-align:center;color:#666;font-size:14px;margin-top:12px}
.animal{border-top:1px solid #ddd;padding:10px 0}
.animal:first-child{border-top:0}
.animal .d{font-size:31px;font-weight:800}
.animal .c{font-size:22px;margin-top:4px}
.animal .tag{font-size:14px;color:#777;margin-bottom:3px}
</style>
</head>

</div>

let input = "";

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function press(n) {
  // After a completed 4-digit search, the next digit starts a new search.
  if (input.length >= 4) input = "";
  input += n;
  document.getElementById("display").textContent = input.padEnd(4, "•");
  if (input.length === 4) search();
}

function clearAll() {
  input = "";
  document.getElementById("display").textContent = "----";
  document.getElementById("result").innerHTML =
    '<div class="label">DATA DE NAIXEMENT</div><div class="sub">Introdueix els 4 dígits de l\'INTERNO</div>';
}

function search() {
  const key = input.padStart(4, "0");
  const rows = DATA[key];
  const box = document.getElementById("result");

  if (!rows || rows.length === 0) {
    box.innerHTML =
      '<div class="label">RESULTAT</div>' +
      '<div class="date">NO TROBAT</div>' +
      '<div class="sub">INTERNO ' + esc(key) + '</div>';
    return;
  }

  if (rows.length === 1) {
    const r = rows[0];
    box.innerHTML =
      '<div class="label">DATA DE NAIXEMENT</div>' +
      '<div class="date">' + esc(r.date || "—") + '</div>' +
      (r.crotal ? '<div class="sub">CROTAL: <b>' + esc(r.crotal) + '</b></div>' : '') +
      '<div class="sub">INTERNO ' + esc(key) + '</div>';
    return;
  }

  // Duplicate interno: show every birth date AND the complete crotal.
  let h =
    '<div class="label">DUPLICATS — INTERNO ' + esc(key) + '</div>' +
    '<div class="dup">' + rows.length + ' animals</div>';

  rows.forEach((r, i) => {
    h += '<div class="animal">' +
         '<div class="tag">ANIMAL ' + (i + 1) + '</div>' +
         '<div class="d">NAIXEMENT: ' + esc(r.date || "—") + '</div>' +
         '<div class="c">CROTAL: <b>' + esc(r.crotal || "—") + '</b></div>' +
         '</div>';
  });
  box.innerHTML = h;
}
</script>
